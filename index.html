<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131a">
  <meta name="description" content="Joyan.in — a personal space taking shape.">
  <title>Joyan.in — Coming Soon</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: rgba(255, 255, 255, 0.055);
      --line: rgba(255, 255, 255, 0.11);
      --text: #f5f1e8;
      --muted: #a9a59c;
      --accent: #d7b77a;
      --accent-soft: rgba(215, 183, 122, 0.16);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(215, 183, 122, 0.12), transparent 32%),
        radial-gradient(circle at 80% 75%, rgba(91, 112, 150, 0.13), transparent 34%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 18px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 28px;
      pointer-events: none;
    }

    .orb {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: var(--accent-soft);
      filter: blur(90px);
      opacity: 0.55;
      pointer-events: none;
    }

    .orb.one { top: -180px; left: -120px; }
    .orb.two { right: -180px; bottom: -170px; background: rgba(90, 120, 170, 0.12); }

    main {
      width: min(760px, calc(100% - 48px));
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .mark {
      width: 68px;
      height: 68px;
      margin: 0 auto 30px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(215, 183, 122, 0.42);
      border-radius: 50%;
      background: rgba(215, 183, 122, 0.08);
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      box-shadow: 0 0 50px rgba(215, 183, 122, 0.08);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(56px, 10vw, 92px);
      font-weight: 400;
      letter-spacing: -0.045em;
      line-height: 0.98;
    }

    h1 span {
      color: var(--accent);
    }

    .message {
      max-width: 580px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2.5vw, 20px);
      line-height: 1.75;
    }

    .construction {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 34px;
      padding: 11px 17px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      color: #d9d5cd;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px rgba(215, 183, 122, 0.65);
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 28px;
      display: flex;
      justify-content: center;
      gap: 22px;
      color: #77746d;
      font-size: 12px;
    }

    footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer a:hover {
      color: var(--text);
    }

    .rule {
      width: 54px;
      height: 1px;
      margin: 34px auto 0;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.7;
    }

    @media (max-width: 600px) {
      body::before { inset: 10px; border-radius: 20px; }
      main { width: min(100% - 34px, 760px); }
      footer { bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main>
    <div class="mark">J</div>
    <p class="eyebrow">Joyan.in</p>
    <h1>Something is <span>taking shape.</span></h1>
    <p class="message">
      This little corner of the web is under construction.
      A thoughtful space is being built here — slowly, deliberately,
      and with a few things worth waiting for.
    </p>
    <div class="rule"></div>
    <div class="construction">
      <span class="dot"></span>
      Website under construction
    </div>
  </main>

  <footer>
    <a href="privacy.html">Privacy</a>
    <span>·</span>
    <a href="terms.html">Terms</a>
  </footer>
</body>
</html>
